services:
  - type: web
    name: quiz-live-groups
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: quiz-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
